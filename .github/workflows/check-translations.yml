name: Check translations

on:
  pull_request:
    paths:
      - 'translations/**'
  push:
    branches: [ master ]
    paths:
      - 'translations/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every language against English
        run: python translations/check.py
